name: CI

on:
  push:
    branches: ["dockerizado", "main"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 23 (Temurin) and enable Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: List pom.xml (diagnostic)
        run: |
          echo "Searching for pom.xml files (depth 3):"
          find . -maxdepth 3 -name pom.xml -print || true

      - name: Run unit tests for catalogo module
        run: |
          # Repository-relative path to the catalog module pom.xml
          CATALOGO_POM=el-almacen-de-peliculas-online/el-almacen-de-peliculas-online/pom.xml
          if [ -f mvnw ]; then
            chmod +x mvnw
            ./mvnw -B -ntp -f "$CATALOGO_POM" test
          else
            mvn -B -ntp -f "$CATALOGO_POM" test
          fi
